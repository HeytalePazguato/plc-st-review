name: ci

# Gate workflow: lint + build + test. Must pass before any package or
# release job is allowed to run. Triggered on every relevant branch push and
# on PRs targeting main or develop.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The parser now ships as WebAssembly (`web-tree-sitter` +
        # `tree-sitter-iec61131-3-st`'s `.wasm`), so there's no native compile
        # and no per-OS toolchain to set up — Windows runs the same as the rest.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # No native build: a plain `npm ci` installs everything (the wasm files
      # ship inside the published packages, nothing compiles).
      - name: Install
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
