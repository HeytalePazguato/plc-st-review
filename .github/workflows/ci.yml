name: ci

# Gate workflow: lint + build + test. Must pass before any package or
# release job is allowed to run. Triggered on every relevant branch push and
# on PRs targeting main or develop.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is omitted from CI: the native build of `tree-sitter`'s
        # binding requires the `C++ Clang Compiler for Windows` + `MSBuild
        # support for LLVM (clang-cl) toolset` components of Visual Studio,
        # which the standard windows-latest runner does not have installed.
        # Linux and macOS use gcc / Apple clang respectively and need no
        # extra setup.
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # Install + patch + native rebuild. See README "Install" section for why
      # this dance is required (tree-sitter 0.25.0's binding.gyp forces /std:c++17
      # but Node 20+ V8 headers require C++20).
      - name: Bootstrap
        run: npm run bootstrap

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
