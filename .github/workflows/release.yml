name: release

# Stable release flow. Triggered when commits land on main (typically from a
# release/* PR that bumped the VERSION file). Reads VERSION as the source of
# truth, tags v<VERSION>, builds and pushes the container image to GHCR,
# updates the major-version ref (`v0`, `v1`, ...) used by the GitHub Action,
# and publishes to npm.
#
# Idempotent: if the tag already exists (i.e. main was pushed without a
# VERSION bump), the workflow exits cleanly without retagging or republishing.
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write   # required by `npm publish --provenance`

concurrency:
  group: release-main
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION
        id: ver
        run: |
          set -euo pipefail
          v=$(tr -d '[:space:]' < VERSION)
          if [ -z "$v" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          major="${v%%.*}"
          echo "version=$v"      >> "$GITHUB_OUTPUT"
          echo "tag=v$v"          >> "$GITHUB_OUTPUT"
          echo "major_ref=v$major" >> "$GITHUB_OUTPUT"

      - name: Idempotence guard
        id: guard
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          if git rev-parse "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.ver.outputs.tag }} already exists; skipping release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.guard.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push version tag
        if: steps.guard.outputs.exists == 'false'
        run: |
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Move major-version ref (vN)
        if: steps.guard.outputs.exists == 'false'
        run: |
          set -euo pipefail
          ref="${{ steps.ver.outputs.major_ref }}"
          # Re-create the major-version tag, force-pushed to this commit. The
          # tag is what users pin via `uses: <owner>/plc-st-review@v0`.
          git tag -fa "$ref" -m "track latest $ref release"
          git push origin "$ref" --force

      - name: Set up Docker buildx
        if: steps.guard.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.guard.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner for image refs
        if: steps.guard.outputs.exists == 'false'
        id: owner
        run: |
          set -euo pipefail
          lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "lc=$lc" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: steps.guard.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/plc-st-review:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/plc-st-review:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.lc }}/plc-st-review:${{ steps.ver.outputs.major_ref }}
          platforms: linux/amd64

      - name: Set up Node for npm publish
        if: steps.guard.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Bootstrap (install + patch + rebuild)
        if: steps.guard.outputs.exists == 'false'
        run: npm run bootstrap

      - name: Build
        if: steps.guard.outputs.exists == 'false'
        run: npm run build

      - name: Publish to npm
        if: steps.guard.outputs.exists == 'false' && env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.guard.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
