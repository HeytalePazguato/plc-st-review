version: 2
updates:
  # GitHub Actions: keep workflow action versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # One PR per scheduled run, regardless of how many actions need bumping.
      gha:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "develop"
    labels:
      - "dependencies"
    groups:
      # Split prod vs dev so the dev-only churn (typescript, vitest, @types/*) doesn't
      # block prod-dep review. Within each group, all updates bundle into one PR.
      npm-prod:
        applies-to: version-updates
        dependency-type: "production"
        patterns:
          - "*"
      npm-dev:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"
