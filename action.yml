name: 'plc-st-review'
description: 'Semantic linter and code reviewer for IEC 61131-3 Structured Text pull requests. 80 checks: signature drift, outdated call sites, enum / array / pragma diffs, FB-instance misuse, timer / counter value changes, complexity / nesting / LOC regressions, dead-code detection, naming conventions, PLCopen-aligned checks (direct-address use, IF-without-ELSE, forbidden statements, pointer arithmetic, parameter / global caps, indirect recursion, uninitialised-var use, TIME equality, multi-writer globals, implicit type conversions, …), an IEC 62443 cybersecurity set (hard-coded credentials / endpoints, unvalidated input, debug pragmas, persistent plaintext secrets), and more.'
author: 'HeytalePazguato'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  pr-number:
    description: 'Pull request number. Defaults to the triggering PR (parsed from GITHUB_REF).'
    required: false
    default: ''
  repo:
    description: 'GitHub repo in owner/name form. Defaults to GITHUB_REPOSITORY.'
    required: false
    default: ''
  github-token:
    description: 'Token used to read the PR and post comments. Falls back to GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}
  severity:
    description: 'Minimum severity to report (info|warn|error).'
    required: false
    default: 'info'
  project-scope:
    description: 'If set (e.g. "**/*.st"), also parse the whole repo so project-scoped checks like DEAD_POU_INTRODUCED can see callers outside the diff. Requires actions/checkout with fetch-depth: 0. Leave empty to keep reviews diff-only and fast.'
    required: false
    default: ''

outputs:
  result:
    description: 'One-line summary line ("plc-st-review (github): inline, N created, ...").'

runs:
  using: 'docker'
  # Build the image from the repo's Dockerfile at action runtime. After 0.0.1
  # ships a versioned GHCR image, advanced consumers can swap this for:
  #     image: 'docker://ghcr.io/heytalepazguato/plc-st-review:v0'
  # to avoid the per-run build cost.
  image: 'Dockerfile'
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
    PLC_PR_INPUT: ${{ inputs.pr-number }}
    PLC_REPO_INPUT: ${{ inputs.repo }}
    PLC_SEVERITY_INPUT: ${{ inputs.severity }}
    PLC_PROJECT_SCOPE_INPUT: ${{ inputs.project-scope }}
