# presets/plcopen.yml
#
# PLCopen Coding Guidelines v1.0 preset for plc-st-review.
#
# Targets the language-independent and Structured-Text subset of PLCopen's
# Coding Guidelines that the engine can express via configuration alone
# (i.e. enabling existing checks at the right severity and tuning their
# settings). Rules that would require new checks are listed as **gaps** in
# docs/presets/plcopen.md; rules whose intent is outside this tool's scope
# (task-model / scheduling / cycle-time rules, single-PROGRAM-writer rules,
# subjective "intent" rules) are listed as **out of scope** there.
#
# Use it from your project's `.plc-st-review.yml`:
#
#   extends:
#     - ./presets/plcopen.yml
#
# Override anything below in your local file — these are PLCopen defaults,
# not your team's rules.

# CP9 — Limit the complexity of POU code.
# PLCopen recommends keeping cyclomatic complexity and nesting low. The
# numbers below are at the strict end of common practice; tune for your repo.
metrics:
  thresholds:
    cyclomatic_complexity:
      warn: 10
      error: 20
    nesting_depth:
      warn: 4
      error: 6

# Severity bumps for the existing checks PLCopen calls for. PLCopen treats
# these as recommended ("should") rather than mandatory ("shall"), so most
# stay at warn; the safety-relevant ones (recursion, duplicate FB-instance
# call) are raised to error.
severity_overrides:
  # C3 — Avoid nested comments.
  NESTED_COMMENTS: warn
  # C4 — Comments may not include code (no commented-out code).
  COMMENTED_OUT_CODE: warn
  # CP8 — Floating-point comparison shall not be equality/inequality.
  REAL_EQUALITY: warn
  # CP13 — POUs shall not call themselves directly. (Indirect recursion is
  # listed as a gap in the mapping doc — needs a project-scope cycle check.)
  RECURSIVE_CALL: error
  # CP14 — POUs shall have a single point of exit.
  MULTIPLE_EXIT_POINTS: warn
  # CP20 — FB instances should be called only once per scope per cycle.
  FB_INSTANCE_DOUBLE_CALL: error
  # CP24 — Do not declare variables that are not used.
  UNUSED_VAR_INTRODUCED: warn
  UNUSED_INPUT_VAR: warn
  UNUSED_OUTPUT_VAR: warn
  # N5 — Local names shall not shadow global names.
  VARIABLE_SHADOWING: warn
  # Tighten output-var hygiene (related to CP14 single-exit / output-write
  # discipline). Reading an output internally usually wants a local var.
  OUTPUT_VAR_READ_INTERNALLY: warn

# N2 / N10 — Type prefixes for variables and user-defined types.
#
# PLCopen mandates *that* type-indicating prefixes exist, but does not fix
# the exact letters. The values below are the most widely cited PLCopen-
# aligned convention; override individual dimensions locally if your team
# uses different letters (e.g. `bool: { prefix: b }` instead of `x`).
naming_conventions:
  bool:              { prefix: x,    case: insensitive }
  int:               { prefix: i,    case: insensitive }
  real:              { prefix: r,    case: insensitive }
  string:            { prefix: s,    case: insensitive }
  time:              { prefix: t,    case: insensitive }
  pointer:           { prefix: p,    case: insensitive }
  reference:         { prefix: ref,  case: insensitive }
  enum_type:         { prefix: E_,   case: sensitive }
  structure_type:    { prefix: ST_,  case: sensitive }
  function_block:    { prefix: FB_,  case: sensitive }
  function:          { prefix: F_,   case: sensitive }
  program:           { prefix: PRG_, case: sensitive }
  fb_instance:       { prefix: fb,   case: insensitive }
  global_var:        { prefix: g,    case: insensitive }
  # N4 — Constants shall be named in UPPERCASE_WITH_UNDERSCORES.
  constant:          { pattern: '^[A-Z][A-Z0-9_]+$' }

# N1 / CP1 — Avoid physical / direct addresses; access by name. The engine's
# FORBIDDEN_SYMBOL check operates on identifier references, but the grammar
# represents `%I0.0` / `%Q0.1` as `direct_address` nodes, not identifiers.
# So this rule is **NOT enforced by this preset** — see the mapping doc
# (gap: needs a new `DIRECT_ADDRESS_USED` check).
#
# L10 — Forbid CONTINUE / EXIT / GOTO. Same situation: these are statement
# nodes, not identifiers, so FORBIDDEN_SYMBOL can't catch them. Listed as a
# gap in the mapping doc.
#
# forbidden_symbols:
#   - (intentionally empty — see gaps in docs/presets/plcopen.md)
