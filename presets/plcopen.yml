# presets/plcopen.yml
#
# PLCopen Coding Guidelines v1.0 preset for plc-st-review.
#
# Targets the language-independent and Structured-Text subset of PLCopen's
# Coding Guidelines. This preset enables every PLCopen rule the engine
# implements today and tunes the existing severity-bearing checks to match
# what PLCopen calls for. Use it as your baseline:
#
#   extends:
#     - ./presets/plcopen.yml
#
# Override anything below in your local config — these are PLCopen defaults,
# not your team's rules.

# CP9 — Limit the complexity of POU code.
metrics:
  thresholds:
    cyclomatic_complexity:
      warn: 10
      error: 20
    nesting_depth:
      warn: 4
      error: 6

# N6 / CP18 / CP23 — numeric caps. These checks no-op unless a cap is set.
limits:
  max_identifier_length: 32      # N6
  max_globals_used_per_pou: 10   # CP18
  max_parameters: 8              # CP23

# N8 — Acceptable identifier character set. Defaults to ASCII letters /
# digits / underscore with a letter or underscore lead — the IEC 61131-3
# standard's identifier grammar. Override locally to allow / forbid extras.
identifier_charset: '^[A-Za-z_][A-Za-z0-9_]*$'

severity_overrides:
  # C2 — All elements shall be commented.
  POU_NOT_COMMENTED: info
  # C3 — Avoid nested comments.
  NESTED_COMMENTS: warn
  # C4 — Comments may not include code.
  COMMENTED_OUT_CODE: warn
  # L10 — Forbid EXIT / CONTINUE / GOTO.
  FORBIDDEN_STATEMENT: warn
  # L12 — FOR loop counter shall not be modified inside the loop.
  FOR_LOOP_VAR_MODIFIED: warn
  # L13 — FOR loop counter shall not be read after the loop terminates.
  FOR_LOOP_VAR_USED_AFTER: info
  # L17 — Every IF shall have an ELSE clause.
  IF_WITHOUT_ELSE: warn
  # N1 / CP1 — Avoid direct (physical) addresses.
  DIRECT_ADDRESS_USED: warn
  # N5 — Local names shall not shadow global names.
  VARIABLE_SHADOWING: warn
  # N6 — Identifier length cap.
  IDENTIFIER_TOO_LONG: info
  # N9 — Different element kinds shall not share a name.
  NAME_REUSED_DIFFERENT_KIND: warn
  # CP8 — Floating-point comparison shall not be equality / inequality.
  REAL_EQUALITY: warn
  # CP13 — POUs shall not call themselves (direct + indirect).
  RECURSIVE_CALL: error
  INDIRECT_RECURSIVE_CALL: error
  # CP14 — POUs shall have a single point of exit.
  MULTIPLE_EXIT_POINTS: warn
  # CP18 — Limit globals referenced from a single POU.
  TOO_MANY_GLOBALS_USED: warn
  # CP20 — FB instances should be called only once per scope per cycle.
  FB_INSTANCE_DOUBLE_CALL: error
  # CP23 — Cap on input/output/in-out count.
  TOO_MANY_PARAMETERS: warn
  # CP24 — Do not declare variables that are not used.
  UNUSED_VAR_INTRODUCED: warn
  UNUSED_INPUT_VAR: warn
  UNUSED_OUTPUT_VAR: warn
  # E2 — Pointer arithmetic shall not be used.
  POINTER_ARITHMETIC: warn
  # E3 — Relational comparisons of pointers shall not be used.
  POINTER_COMPARED: warn
  # Adjacent to CP14 output-write discipline.
  OUTPUT_VAR_READ_INTERNALLY: warn
  # CP3 — All variables shall be initialised before being used.
  UNINITIALIZED_VAR_USED: warn
  # CP6 — Avoid VAR_EXTERNAL inside function-like POU bodies.
  EXTERNAL_VAR_IN_FUNCTION: warn
  # CP25 — Data-type conversions shall be explicit.
  IMPLICIT_TYPE_CONVERSION: info
  # CP26 — A global variable shall be written by at most one PROGRAM.
  MULTI_WRITER_GLOBAL: error
  # CP28 — TIME equality / inequality shall not be used.
  TIME_EQUALITY: warn
  # N8 — Identifier charset is defined and enforced.
  IDENTIFIER_CHARSET: info

# N2 / N10 — Type prefixes for variables and user-defined types.
#
# PLCopen mandates *that* type-indicating prefixes exist, but does not fix
# the exact letters. The values below are the most widely cited PLCopen-
# aligned convention; override individual dimensions locally if your team
# uses different letters (e.g. `bool: { prefix: b }` instead of `x`).
naming_conventions:
  bool:              { prefix: x,    case: insensitive }
  int:               { prefix: i,    case: insensitive }
  real:              { prefix: r,    case: insensitive }
  string:            { prefix: s,    case: insensitive }
  time:              { prefix: t,    case: insensitive }
  pointer:           { prefix: p,    case: insensitive }
  reference:         { prefix: ref,  case: insensitive }
  enum_type:         { prefix: E_,   case: sensitive }
  structure_type:    { prefix: ST_,  case: sensitive }
  function_block:    { prefix: FB_,  case: sensitive }
  function:          { prefix: F_,   case: sensitive }
  program:           { prefix: PRG_, case: sensitive }
  fb_instance:       { prefix: fb,   case: insensitive }
  global_var:        { prefix: g,    case: insensitive }
  # N4 — Constants shall be named in UPPERCASE_WITH_UNDERSCORES.
  constant:          { pattern: '^[A-Z][A-Z0-9_]+$' }
