name: 'plc-st-review'
description: 'Semantic code review for IEC 61131-3 Structured Text pull requests'
author: 'HeytalePazguato'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  pr-number:
    description: 'Pull request number. Defaults to the triggering PR if available.'
    required: false
  repo:
    description: 'GitHub repo in owner/name form. Defaults to the running workflow''s repo.'
    required: false
  github-token:
    description: 'Token used to read the PR and post comments. Falls back to the auto-provided GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}
  config:
    description: 'Path to .plc-st-review.yml.'
    required: false
  severity:
    description: 'Minimum severity to report (info|warn|error).'
    required: false
    default: 'info'

outputs:
  result:
    description: 'One-line summary line ("plc-st-review (github): inline, N created, ...").'

runs:
  using: 'docker'
  image: 'docker://ghcr.io/heytalepazguato/plc-st-review:latest'
  args:
    - '--github'
    - '--pr'
    - ${{ inputs.pr-number || github.event.pull_request.number }}
    - '--repo'
    - ${{ inputs.repo || github.repository }}
    - '--severity'
    - ${{ inputs.severity }}
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
